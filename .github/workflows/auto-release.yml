name: Auto release

on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new_version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          if [[ -z "$new_version" ]]; then
            echo 'Unable to read version from pubspec.yaml.'
            exit 1
          fi
          old_version=''
          if git cat-file -e "$BEFORE_SHA:pubspec.yaml" 2>/dev/null; then
            old_version=$(git show "$BEFORE_SHA:pubspec.yaml" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          fi
          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version remains $new_version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$GITHUB_REF_NAME" == 'main' && ! "$new_version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $new_version."
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == 'dev' && ! "$new_version" =~ $prerelease_pattern ]]; then
            echo "dev requires a -dev.N prerelease version, got $new_version."
            exit 1
          fi
          {
            echo 'changed=true'
            echo "tag=cached_video_thumbnail-v$new_version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag is new
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || [[ -n "$remote_tag" ]]; then
            echo "Tag $RELEASE_TAG already exists. Never move or reuse a release tag."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_PAT }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'TAG_PUSH_PAT is required to trigger the publishing workflow.'
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "refs/tags/$RELEASE_TAG"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#cached_video_thumbnail-v}
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if [[ ! -s "$notes" ]]; then
            echo "No changelog entry found for $version."
            exit 1
          fi
          args=("$RELEASE_TAG" --verify-tag --notes-file "$notes" --target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_NAME" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
