name: cached_video_thumbnail
description: "High-performance video thumbnail engine: cached, scheduled, cancellable thumbnail generation from asset, file, and network videos."
version: 0.2.0
homepage: https://github.com/omar-hanafy/cached_video_thumbnail
repository: https://github.com/omar-hanafy/cached_video_thumbnail
issue_tracker: https://github.com/omar-hanafy/cached_video_thumbnail/issues

topics:
  - video
  - thumbnail
  - cache
  - performance
  - media

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  # Own this runtime floor: path_provider still permits platform 3.0.0,
  # which calls Platform.packageRoot, removed from supported Dart SDKs.
  platform: ^3.2.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.8

flutter:
  plugin:
    platforms:
      android:
        package: tech.tomars.cached_video_thumbnail
        pluginClass: ThumbnailPlugin
      ios:
        pluginClass: ThumbnailPlugin
