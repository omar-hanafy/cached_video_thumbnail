name: cached_video_thumbnail_example
description: "Demonstrates how to use the thumbnail plugin."
publish_to: 'none'

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  cached_video_thumbnail:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/landscape.mp4
    - assets/fixtures/portrait_rot90.mp4
